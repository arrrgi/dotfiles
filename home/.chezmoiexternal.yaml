{{- $refreshPeriod := "168h" }}

{{/* Define cross platform externals first */}}

{{/* WSL specific externals */}}

{{- if and .target.wsl (or .secrets.apikeys .secrets.sshkeys .secrets.storagekeys) }}
".local/bin/age":
  type: archive-file
  url: "https://github.com/FiloSottile/age/releases/download/v{{ .tools.binaries.age }}/age-v{{ .tools.binaries.age }}-{{ .chezmoi.os }}-{{ .chezmoi.arch }}.tar.gz"
  executable: true
  path: age/age
{{- end }}

{{/* Darwin specific externals */}}

{{/* Ubuntu specific externals */}}
{{- if and .target.ubuntu .access.controlled }}
".local/bin/btop":
  type: archive-file
  url: "https://github.com/aristocratos/btop/releases/download/v{{ .tools.binaries.btop }}/btop-x86_64-unknown-{{ .chezmoi.os }}-musl.tar.gz"
  executable: true
  path: btop/bin/btop

".local/bin/fast-cli":
  type: archive-file
  url: "https://github.com/mikkelam/fast-cli/releases/download/v{{ .tools.binaries.fastcli }}/fast-cli-x86_64-{{ .chezmoi.os }}.tar.gz"
  executable: true
  path: fast-cli
{{- end }}
